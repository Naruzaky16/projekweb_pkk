.menu a {

.menu-item {

.dropdown-content {

}

.b:hover {
    transform: translateY(-10px);
    box-shadow: 0 8px 12px rgba(0,0,0,0.3);
}


.bimg {
    width: 240px;
    height: 200px;
    border: 2px solid slategray;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.img1 {
    max-width: 100%;
    transition: 0.5s;
    filter: drop-shadow(5px 10px 15px rgba(0, 0, 0, 0.6));
}

.b:hover .img1 {
    transform: translate(-15px, -20px) rotate(-15deg);
}


.n {
    margin-top: 15px;
    text-align: center;

.btn {

    padding: 6px 10px;
    background-color: darkgrey;
